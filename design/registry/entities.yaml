# ─── EVENTS ──────────────────────────────────────────────────────────────────
# Señales/eventos que cruzan la frontera entre sistemas. Registrar un evento
# cuando lo emite un sistema y lo consume otro.
#
# POR QUÉ EXISTE ESTA SECCIÓN (añadida 2026-08-03 por /consistency-check):
# el contrato entre los sistemas 1, 2, 4, 16 y 20 es mayoritariamente de eventos,
# y hasta ahora ningún artefacto registraba QUIÉN EMITE QUÉ. Consecuencia directa:
# el GDD de Combate atribuyó los eventos de ventana activa al sistema 20 durante
# dos días y sobrevivió DOS pasadas de /design-review, porque no había nada contra
# lo que contrastarlo. Las secciones entities/items/formulas/constants no podían
# expresar este tipo de hecho.
#
# Campos: name, status, emitter, consumers[], payload, added, revised
#   - emitter: el GDD del sistema que EMITE. Es el dueño del contrato.
#   - consumers: todos los GDDs que lo consumen (incluidos los que aún no existen,
#     marcados con `# (no existe aún)`).
#   - canonical_name: nombre snake_case en tiempo pasado, per coding-standards.md.
#     PROVISIONAL hasta que /create-architecture lo fije en un ADR — hoy los GDDs
#     solo tienen nombres en prosa.

events:
  - name: "inicio de Golpe / fin de Golpe"
    canonical_name: golpe_iniciado / golpe_terminado   # provisional, pendiente de ADR
    status: active
    emitter: design/gdd/maquina-estados-jefe.md
    consumers:
      - design/gdd/combate-parry-absorcion.md
    payload: "ninguno declarado todavía"
    notes: "Delimitan la ventana activa contra la que Combate resuelve un parry.
      REPARTO DE TRES PARTES (fijado 2026-08-03): el sistema 20 posee las DURACIONES y
      la composición de patrones; el sistema 2 es el EMISOR CANÓNICO (sus límites de
      estado son lo que dispara el evento); Combate es el CONSUMIDOR.
      Combate atribuía la emisión al sistema 20 en tres sitios y no mencionaba al
      sistema 2 en ninguna parte — incumplía la regla de dependencias bidireccionales
      de .claude/rules/design-docs.md. Corregido por enmienda el 2026-08-03."
    added: 2026-08-03
    revised: ""

  - name: "inicio de Ventana Especial / fin de Ventana Especial"
    canonical_name: ventana_especial_iniciada / ventana_especial_terminada
    status: active
    emitter: design/gdd/maquina-estados-jefe.md
    consumers:
      - design/gdd/combate-parry-absorcion.md
    payload: "ninguno declarado todavía"
    notes: "Par DELIBERADAMENTE DISTINTO del de Golpe. Lo declara un patrón con
      interrumpible_por_parry = true (sistema 2, Core Rule 5); está PROHIBIDO bajo
      interrumpible_por_parry = false.
      RAZÓN DE SER UN EVENTO PROPIO: el AC C4 de Combate verifica que un parry exitoso
      aplica sus CUATRO consecuencias como paquete atómico. Un parry contra una Ventana
      Especial debe aplicar solo DOS (Gracia ✓, hitstop ✓, Postura ✗, Repliegue ✗), y
      Combate no tiene ningún concepto de Acción Especial con el que distinguir los
      casos. Con evento propio, los distingue por el evento mismo sin inspeccionar el
      estado del jefe. Ver la excepción de Ventana Especial en la Regla 4 de Combate.
      Una Ventana Especial NO parada no daña al jugador (excepción a la Regla 6).
      FEEDBACK (añadido 2026-08-04, changeset 2 ítem 3): los tres instantes de PARRY son
      del sistema 1 — eventos 14 (la ventana se abre), 15 (parada) y 16 (se cierra sin
      parar). La COMPLETACIÓN y la INTERRUPCIÓN de la Acción Especial son del sistema 2,
      que ya tiene fila para la interrupción.
      DEUDA ABIERTA CONTRA EL SISTEMA 2 (congelado): (a) no existe fila de feedback para
      la COMPLETACIÓN, y el AC V7 del sistema 1 exige que sea distinguible del cierre de
      ventana y que ninguno de los dos se lea como alivio; (b) no existe evento declarado
      para la completación en ningún GDD ni en este registry, pese a que el AC C22 del
      sistema 1 cuelga de ese instante — mismo defecto DE TIPO que tuvo
      recuperacion_recepcion: un contrato que nombra algo que no existe. Va a la 4ª
      pasada del sistema 2."
    added: 2026-08-03
    revised: ""

  - name: "parry exitoso / parry fallido (+ Postura resultante)"
    canonical_name: parry_resuelto   # provisional; lleva resultado y Postura
    status: active
    emitter: design/gdd/combate-parry-absorcion.md
    consumers:
      - design/gdd/maquina-estados-jefe.md
      - design/gdd/sistema-de-gracia.md          # (no existe aún) — sistema 5
      - design/gdd/feedback-de-impacto.md        # (no existe aún) — sistema 4
      - design/gdd/feedback-sonoro-parry.md      # (no existe aún) — sistema 16
    payload: "resultado (éxito/fallo) + valor de Postura resultante"
    notes: "Es el evento del que depende TODA la bifurcación de salida del sistema 2
      (Repliegue / Aturdido / Enfriamiento) — su dependencia DURA hacia Combate.
      SUJETO A LA REGLA 8 del sistema 2 (resolución síncrona): la transición que este
      evento dispara debe resolverse dentro del mismo call stack, sin await, señales
      diferidas, Tween, SceneTreeTimer ni callbacks de AnimationMixer. Ningún consumidor
      puede invocar de vuelta al FSM durante el despacho (prohibición de reentrada)."
    added: 2026-08-03
    revised: ""

  - name: "combo abortado"
    canonical_name: combo_abortado
    status: active
    emitter: design/gdd/maquina-estados-jefe.md
    consumers:
      - design/gdd/feedback-de-impacto.md        # (no existe aún) — sistema 4, PREVISTO
      - design/gdd/feedback-sonoro-parry.md      # (no existe aún) — sistema 16, PREVISTO
    payload: "i (índice del golpe fallado, 1 <= i <= N) + N (longitud del combo)"
    notes: "El payload es NORMATIVO, no opcional. Sin i y N, ningún sistema aguas abajo
      puede distinguir 'el jugador falló el primer golpe' de 'paró 4 de 5 y falló el
      último' — dos experiencias de peso emocional opuesto que producirían feedback
      idéntico. Verificado por el AC C3b del sistema 2, que exige LEER el payload del
      evento capturado, no inferirlo del estado resultante.
      RIESGO ABIERTO: ningún GDD declara todavía que vaya a consumir estos campos. El
      dato está expuesto pero podría no leerse nunca, con lo que el problema de
      percepción original reaparecería intacto. Los consumidores listados son PREVISTOS,
      no confirmados — cerrar al autorar los sistemas 4 y 16."
    added: 2026-08-03
    revised: ""

  - name: "duelo ganado"
    canonical_name: duelo_ganado
    status: active
    emitter: design/gdd/maquina-estados-jefe.md
    consumers:
      - design/gdd/gestion-de-run.md             # (no existe aún) — sistema 3
    payload: "sin definir — Open Question del sistema 2"
    notes: "Emitido exactamente UNA vez, al entrar en el estado terminal Muerto (AC C6
      del sistema 2). La secuencia de post-duelo (pantalla, persistencia) es propiedad
      de Gestión de Run, no del sistema 2.
      NUNCA se emite si el duelo termina por derrota del jugador — en ese caso el FSM
      del jefe se congela sin emitir ninguna señal de transición (espejo del AC E7 de
      Combate).
      OPEN QUESTION: ¿lleva payload (qué jefe, qué tríada, tiempo del duelo) o basta la
      señal? Lo decide el GDD de Gestión de Run al autorarse.
      PROPIEDAD DESAMBIGUADA 2026-08-04 (enmienda D del GDD de Combate): hasta esa fecha
      AMBOS GDDs se adjudicaban este evento — el sistema 2 explícitamente (tres sitios),
      y Combate por implicación, al listarlo en Dependencies y Cross-References como
      evento que Gestión de Run le consume A COMBATE. Este registry ya tenía al sistema 2
      como emitter desde el 2026-08-03 y no se modifica: la corrección cayó entera en
      Combate, que es lo que permitió aplicarla con el sistema 2 congelado.
      CRITERIO ADOPTADO: cada evento lo emite el GDD que posee el recurso cuyo
      agotamiento lo causa. La Vida del jefe la agota la Fórmula 6 de Combate, pero el
      ESTADO TERMINAL que lo reconoce es Muerto, del sistema 2 — y un evento de fin de
      duelo es una transición de estado, no un cálculo de daño. Ver 'duelo perdido'."
    added: 2026-08-03
    revised: 2026-08-04

  - name: "duelo perdido"
    canonical_name: duelo_perdido
    status: active
    emitter: design/gdd/combate-parry-absorcion.md
    consumers:
      - design/gdd/gestion-de-run.md             # (no existe aún) — sistema 3
    payload: "sin definir — misma Open Question que duelo_ganado"
    notes: "Emitido por COMBATE cuando la Vida del jugador llega a 0 (Regla 6, Fórmula 5).
      Es el hermano asimétrico de duelo_ganado: los dos son simétricos para Gestión de
      Run pero NO tienen el mismo dueño, porque cada uno lo emite el GDD que posee el
      recurso que se agota — la Vida del jugador es de Combate, la del jefe termina en un
      estado del sistema 2.
      REGISTRADO 2026-08-04 (enmienda D). Existía como prosa en Dependencies y
      Cross-References de Combate desde el principio, siempre emparejado con duelo_ganado
      y por tanto arrastrando su ambigüedad de propiedad.
      PRIORIDAD ABSOLUTA: la derrota del jugador gana a cualquier estado del enemigo,
      incluido Aturdido con la ventana de Castigo abierta (AC E7 de Combate). Su espejo
      en el sistema 2 es la congelación del FSM del jefe SIN emitir ninguna señal de
      transición — por eso duelo_ganado nunca se emite en este camino.
      SECUENCIA DE POST-DERROTA (pantalla, persistencia entre runs): propiedad de Gestión
      de Run, no de Combate. Open Question abierta en el GDD de Combate."
    added: 2026-08-04
    revised: ""
