# ─── ENTITIES ────────────────────────────────────────────────────────────────
# Named game-world objects: enemies, NPCs, characters, factions, bosses.
# Register an entity here when it appears in more than one GDD — e.g., an
# enemy defined in combat.md that also drops items listed in inventory.md.
#
# Required fields: name, status, source, referenced_by, added
# Attribute fields: any key stats that could appear in another GDD
#   (health, damage, drops, faction, etc.)

entities: []

# Example (remove when first real entry is added):
#
# entities:
#   - name: goblin
#     status: active              # active | deprecated
#     source: design/gdd/combat.md
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/inventory.md
#     health: 40
#     damage: 8
#     drops:
#       - item: goblin_arm        # must match an entry in items section
#         qty: 1
#         drop_rate: 0.8          # 0.0–1.0
#     added: 2026-03-26
#     revised: ""


# ─── ITEMS ───────────────────────────────────────────────────────────────────
# Named collectables, equipment, consumables, crafting materials, currency.
# Register an item when its name or value appears in more than one GDD.
#
# Required fields: name, status, source, referenced_by, added
# Attribute fields: value_gold, weight, stackable, category, and any stat
#   modifiers that another system (e.g., economy, crafting) might reference.

items: []

# Example:
#
# items:
#   - name: goblin_arm
#     status: active
#     source: design/gdd/combat.md   # drop defined in combat GDD
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/inventory.md    # inventory GDD lists its weight/stack rules
#       - design/gdd/economy.md      # economy GDD references its sell price
#     value_gold: 5
#     weight: 1
#     stackable: true
#     category: crafting_material
#     added: 2026-03-26
#     revised: ""


# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: postura_dano
    status: active
    source: design/gdd/combate-parry-absorcion.md
    referenced_by:
      - design/gdd/combate-parry-absorcion.md
      - design/gdd/maquina-estados-jefe.md
    variables:
      - dano_base
      - calidad_timing
      - umbral_precision
      - bono_precision
    output_range: [10, 14]
    expression: "dano_base * (1 + calidad_timing * bono_precision)"
    notes: "Daño de Postura por parry exitoso. En combos se aplica UNA sola vez,
      usando la calidad_timing del último parry del combo (Regla C.9).
      output_range corregido 2026-08-01: era [10, 15]; el techo de 15 solo se
      alcanza con bono_precision=0.5 (techo del rango de tuning), NO en la
      configuración de lanzamiento (bono_precision=0.4 → máximo 14). El propio GDD
      ya advertía de no usar 1.5x como referencia.
      INVARIANTE R1: dano_base * (1 + bono_precision) < postura_base — en los techos
      (15 × 1.5 = 22.5) contra el suelo de postura_base (20), un solo Parry Justo
      rompería la Postura entera. Verificar en cualquier retune.
      ESCALONADO POR TICKS (2026-08-04, changeset 2 ítem 1): calidad_timing dejó de ser
      continua. Toma exactamente 7 valores, indexados por Delta = distancia en TICKS
      ENTEROS entre el tick de detección del input y el tick de inicio de la ventana
      parable: calidad = clamp(1 - (Delta - 0.5)/umbral_precision, 0, 1). Con
      umbral_precision = 5: Delta 0..>=6 -> 1.0 / 0.9 / 0.7 / 0.5 / 0.3 / 0.1 / 0.0, y
      postura_dano -> 14.0 / 13.6 / 12.8 / 12.0 / 11.2 / 10.4 / 10.0 (AC D1).
      El término -0.5 compensa el sesgo de muestreo: detectar en el tick T implica
      pulsación en (T-1, T], así que el Delta medido sobrepasa al real medio tick de
      media, SIEMPRE en la dirección que castiga.
      Por qué importa: escrita como continua, la fórmula invitaba a implementarla con
      reloj real — el drift que la Regla 2 existe para evitar. El AC D14 lo detecta: la
      aparición de UN SOLO valor intermedio es prueba de implementación por wall-clock."
    added: 2026-07-31
    revised: 2026-08-04

  - name: postura_max
    status: active
    source: design/gdd/combate-parry-absorcion.md
    referenced_by:
      - design/gdd/combate-parry-absorcion.md
      - design/gdd/maquina-estados-jefe.md
    variables:
      - postura_base
      - incremento_postura_triada
      - indice_triada
    output_range: [30, 50]
    expression: "postura_base + incremento_postura_triada * indice_triada"
    notes: "Postura máxima del ángel por tríada. indice_triada: 0=Humanidad,
      1=Cosmos, 2=Cercanía a Dios. Con dano_base=10 equivale a 3/4/5 parries para
      romper compostura. Será referenciada por el GDD de IA de Combate de Jefes.
      Expresión corregida 2026-08-01: antes hardcodeaba los literales 30 y 10, lo
      que la desincronizaba de sus propios tuning knobs (postura_base 20-40,
      incremento_postura_triada 5-15) y violaba el estándar data-driven."
    added: 2026-07-31
    revised: 2026-08-01

  - name: punish_dano_pct
    status: active
    source: design/gdd/combate-parry-absorcion.md
    referenced_by:
      - design/gdd/combate-parry-absorcion.md
    variables:
      - ciclos_objetivo_base
      - ciclos_objetivo
    output_range: [16.7, 25]
    expression: "100 / ciclos_objetivo, donde ciclos_objetivo = ciclos_objetivo_base + indice_triada"
    notes: "Porcentaje de Vida máxima del ángel que quita un Golpe de Castigo.
      4/5/6 ciclos por tríada → 25%/20%/16.7%. Nunca permite matar en 1 ciclo.
      Expresión corregida 2026-08-01: antes hardcodeaba el literal 4 en vez del knob
      ciclos_objetivo_base. Ese knob está algebraicamente forzado a 4 exacto — es la
      única forma de satisfacer 4 <= base + indice <= 6 para las tres tríadas a la
      vez con la estructura actual de la fórmula (verificado por systems-designer)."
    added: 2026-07-31
    revised: 2026-08-01

  - name: vida_maxima
    status: active
    source: design/gdd/combate-parry-absorcion.md
    referenced_by:
      - design/gdd/combate-parry-absorcion.md
    variables:
      - vida_base
      - angeles_absorbidos
      - bono_vida_por_absorcion
      - bono_reliquias
    output_range: [100, null]
    expression: "vida_base + (angeles_absorbidos * bono_vida_por_absorcion) + bono_reliquias"
    notes: "Vida máxima del jugador. angeles_absorbidos es propiedad del Sistema de
      Gracia (decisión independiente por ángel); bono_reliquias es propiedad de
      Elección de Reliquias. Ciclo de dependencia documentado en systems-index.md.
      Sin tope superior fijado — pendiente de acotar al diseñar Gracia/Reliquias.
      BLOQUEANTE CERRADO el 2026-08-04 por R10a (changeset 2 ítem 2) — el alcance de R5
      era el equivocado (hallazgo de economy-designer, 3ª pasada). R5 guarda
      solo el término (angeles_absorbidos * bono_vida_por_absorcion), pero
      bono_reliquias entra ADITIVAMENTE en la misma suma y está declarado '0+', SIN
      TOPE, en una fórmula que este GDD posee. Si el sistema 9 publica una sola
      reliquia del orden de una absorción (15-20 HP no es una petición grande),
      'rechazar todos los ángeles' pasa a estar mecánicamente no dominado y la
      premisa que justifica R5 ('absorber es la única palanca de supervivencia') se
      vuelve falsa por la propia matemática del sistema. La colisión es PREDECIBLE,
      no casual: al cerrar multiplicador_ataque en 1.0 (R4), el GDD recomienda
      explícitamente a las reliquias la vía de la Vida máxima — empuja al sistema 9
      hacia el único término que dejó sin guardar.
      CÓMO SE CERRÓ: invariante R10, que reescribe el contrato con el sistema 9 sobre
      CUATRO MAGNITUDES OBSERVABLES en vez de sobre mecanismos — golpes_sobrevividos,
      ciclos_efectivos, parries_por_ciclo y cobertura temporal efectiva. R10a exige que
      las reliquias no compren más de UN golpe sobrevivido, para las cuatro cuentas de
      absorción; el presupuesto vinculante es el de 0 absorciones (+25 de Vida, o -20%
      de daño recibido), NO el de 3 (+46) — un test que solo midiera al jugador
      totalmente absorbido dejaría pasar casi el doble. bono_reliquias deja de estar
      declarado '0+'. R5 se conserva como guarda del PAR DE KNOBS de este GDD, pero deja
      de ser la que protege la premisa: eso lo hace R10a, sobre los tres términos de la
      suma y sobre cualquier mecanismo. Verificado por C26 (validación de datos: todo
      efecto debe declararse como delta sobre las cuatro magnitudes, no existe 'efecto
      no clasificado'), D15 y D16."
    added: 2026-07-31
    revised: 2026-08-04

  - name: dano_golpe_castigo
    status: active
    source: design/gdd/combate-parry-absorcion.md
    referenced_by:
      - design/gdd/combate-parry-absorcion.md
      - design/gdd/maquina-estados-jefe.md   # añadido 2026-08-03: faltaba desde la 1ª pasada
    variables:
      - vida_max_angel
      - punish_dano_pct
      - multiplicador_ataque
    output_range: [null, null]
    expression: "vida_max_angel * (punish_dano_pct / 100) * multiplicador_ataque"
    notes: "ÚNICA fuente de daño del jugador — no hay ataque básico fuera de la
      ventana de Aturdimiento. vida_max_angel es propiedad de IA de Combate de
      Jefes; multiplicador_ataque (base 1.0) es propiedad de Elección de Reliquias.
      INVARIANTE R4 (corregida dos veces): multiplicador_ataque = 1.0 EXACTAMENTE,
      constante cerrada en ambos sentidos. La restricción original (punish_dano_pct *
      multiplicador_ataque < 100) era la desigualdad equivocada — solo prevenía el
      one-shot. Como punish_dano_pct ya es 100/ciclos_objetivo, los ciclos reales son
      ciclos_objetivo/multiplicador, así que cualquier multiplicador > 1.0 rompe el
      suelo de 4/5/6 ciclos de la Fórmula 3 (una reliquia a 1.5 mataba a Cercanía a
      Dios en 4 golpes en vez de 6). La segunda corrección ('<= 1.0') era la
      desigualdad correcta pero de un solo lado, y dejaba abierto el colapso a 0.
      Consecuencia: las reliquias NO pueden tocar el daño de castigo en absoluto;
      deben expresar su poder en otra dimensión (ver Open Questions).
      NOTA DE INTEGRACIÓN: el sistema 9 tampoco es libre en las dimensiones que SÍ
      puede usar — cualquier modificador de parry_window o recuperacion_whiff debe
      reverificar la invariante R6 sobre los valores efectivos (AC D10).
      REGLA DE CLAMP DE LA VIDA DEL JEFE (añadida 2026-08-04, changeset 1 de la 3ª
      pasada; hallazgo convergente de systems-designer y qa-lead): si la Vida
      resultante queda por debajo de 0, se CLAMPA A 0 — el exceso no se transfiere,
      no se acumula y no produce efecto alguno. Un residuo de valor absoluto <= 1e-6
      se trata como 0. TRAS EL CLAMP, Vida == 0 clasifica el golpe como LETAL (AC
      E11) y Vida > 0 como NO LETAL (AC E10): la partición es total y sin
      solapamiento. Verificado por el AC E12, nuevo.
      Por qué hacía falta: punish_dano_pct = 100/ciclos_objetivo no es representable
      en binario para dos de las tres tríadas — Cercanía a Dios da 100/6 = 16.666...%
      y en doble precisión 6 * (200/6) = 200.00000000000003, así que el sexto castigo
      dejaba la Vida en un negativo minúsculo en vez de en 0 exacto. La Postura tenía
      su regla de overkill desde la primera versión (AC E5); la Vida del jefe NUNCA la
      tuvo, de modo que E10/E11 no eran partición exhaustiva y el fixture de E11 no
      era construible de forma fiable. Es la raíz C de la 3ª pasada: la guarda puesta
      sobre un recurso y no sobre el otro."
    added: 2026-07-31
    revised: 2026-08-04

  - name: dano_golpe_enemigo
    status: active
    source: design/gdd/combate-parry-absorcion.md
    referenced_by:
      - design/gdd/combate-parry-absorcion.md
    variables:
      - vida_base
      - golpes_para_morir_base
    output_range: [13.3, 50]
    expression: "vida_base / golpes_para_morir_base"
    notes: "Fórmula 8. Daño que un Golpe no parado inflige a la Vida del jugador. Con
      los valores de lanzamiento (100 / 4) = 25 exacto. AÑADIDA 2026-08-04, changeset 2
      ítem 0 de la 3ª pasada: hasta entonces la Regla 6 decía 'reduce su Vida actual'
      SIN FÓRMULA NI MAGNITUD, pese a que tres reglas normativas del sistema 2 razonan
      sobre ese daño. Era además el bloqueo mutuo del ítem 0: sin ella no se podía
      cuantificar el coste de dejar que el jefe complete una Acción Especial, que es
      justo el número del que depende que la Ventana Especial deje de estar dominada
      (ver severidad_accion_especial y R9a).
      ANCLA: vida_base, NUNCA vida_maxima. Es decisión de diseño, no conveniencia
      aritmética — si el daño escalase con vida_maxima, absorber no compraría
      supervivencia (mismo número de golpes hasta morir hiciera lo que hiciera) y la
      'decisión de diseño clave' de la Fórmula 5, pivote mecánico del dilema moral,
      quedaría decorativa. Fijado por el AC D11, cuyo caso de 3 absorciones es el ÚNICO
      que distingue las dos anclas: a 0 absorciones ambas implementaciones pasan.
      NO ESCALA POR TRÍADA y NO tiene multiplicador por tipo de ataque. Los tres
      índices dan el mismo número; la dificultad diferencial ya está en la longitud del
      duelo (el mismo presupuesto de 4 errores sobre 12 parries en Humanidad frente a
      30 en Cercanía a Dios: la tolerancia cae del 33% al 13% sin tocar una cifra).
      Es el Pilar 1 aplicado literalmente y el preámbulo de la sección Formulas.
      Se omite severidad_golpe por tipo porque un multiplicador sin acotar por ambos
      lados ya mordió en multiplicador_ataque (R4, corregido dos veces) y en
      bono_reliquias (bloqueante abierto); si el sistema 20 lo necesita, entra con
      banda de dos lados desde el primer día.
      FORMA: división directa, no vida_base * (pct/100). La forma en porcentaje es la
      que obligó a escribir el clamp de la Vida del jefe (viaje de ida y vuelta por un
      porcentaje no representable en binario). NO elimina la necesidad del clamp — ver
      la regla de clamp de la Vida del jugador abajo.
      REGLA DE CLAMP DE LA VIDA DEL JUGADOR (añadida en el mismo changeset): si la Vida
      resultante queda por debajo de 0, se CLAMPA A 0; el exceso no se transfiere, no
      se acumula, no produce efecto. Residuo de valor absoluto <= 1e-6 se trata como 0.
      TRAS EL CLAMP, Vida == 0 es la condición EXACTA que dispara 'duelo perdido', sin
      comparación < 0. Verificado por el AC E13.
      Por qué faltaba: el changeset 1 justificó el clamp del jefe como 'el único recurso
      agotable sin ella', afirmación FALSA al escribirse — la Vida del jugador tampoco
      lo tenía. No se detectó porque hasta este changeset el daño al jugador no era una
      cantidad calculada. Con vida_base en 80-150 el cociente no es entero en la mayor
      parte del rango (con el suelo efectivo 110 de R5: 110/4 = 27.5). CUARTA aparición
      de la raíz C. La simetría E5 (Postura) / E12 (Vida del jefe) / E13 (Vida del
      jugador) queda ahora completa.
      Junto con la severidad de una Acción Especial completada (R9a), es la única
      fuente de daño al jugador. Una Ventana Especial no parada NO usa esta fórmula:
      no daña en absoluto (corolario de la Regla 6)."
    added: 2026-08-04
    revised: 2026-08-04

  - name: gracia_ganada
    status: active
    source: design/gdd/combate-parry-absorcion.md
    referenced_by:
      - design/gdd/combate-parry-absorcion.md
      - design/gdd/maquina-estados-jefe.md   # añadido 2026-08-03 (Ventana Especial)
    variables:
      - gracia_base
      - modificador_combo
    output_range: [null, null]
    expression: "gracia_base * modificador_combo"
    notes: "modificador_combo = 1.0 en golpe simple, 0.5 por cada parry dentro de un
      combo. gracia_base NO es propiedad de este GDD — la fija el Sistema de Gracia.
      Consecuencia de diseño: los combos son ricos en gracia y pobres en postura.
      INVARIANTE R7 (nueva, 2026-08-01 re-review): modificador_combo > 1 / N_min. La
      Regla 9 promete que 'un combo genera más gracia total que un golpe simple', lo
      que equivale a N * modificador_combo > 1. Con el valor SHIPPEADO (0.5) y N=2 el
      producto es exactamente 1.0 — IGUAL, no mayor: la garantía fallaba en el valor
      de lanzamiento, no en un extremo de tuning. En el suelo del rango antiguo (0.3)
      daba 0.6, es decir MENOS gracia que un golpe simple a cambio de dos parries
      consecutivos sin margen. Detectado por systems-designer.
      RESUELTO fijando N_min = 3 (ver constante longitud_combo) en vez de retunear un
      valor ya calibrado. El umbral exacto es 1/3 = 0.3333; el rango seguro del knob
      se eleva de 0.3-0.8 a 0.35-0.8, con el suelo en 0.35 por margen de seguridad
      (el tramo estrictamente ilegal es [0.30, 0.3333]).
      Verificado por los ACs D7 y D9.
      TERCERA VÍA DE CONCESIÓN (2026-08-03, decisión de usuario en la 2ª pasada del
      sistema 2): un parry exitoso resuelto contra una VENTANA ESPECIAL —el par de
      eventos propio de una Acción Especial interrumpible— concede gracia COMPLETA
      (modificador_combo = 1.0), pese a no aplicar daño de Postura ni Repliegue.
      Razón: arrebatarle a un ángel su habilidad divina es la fantasía de robo del
      Pilar 2, y por el Pilar 1 el triunfo también corrompe. Ver la excepción de
      Ventana Especial en la Regla 4 de Combate."
    added: 2026-07-31
    revised: 2026-08-03   # was: revised 2026-08-01

  - name: restantes
    status: active
    source: design/gdd/combate-parry-absorcion.md
    referenced_by:
      - design/gdd/combate-parry-absorcion.md
      - design/gdd/maquina-estados-jefe.md
    variables:
      - ventana_castigo
      - T
    output_range: [1, 180]   # = [1, ventana_castigo]; 180 es el TECHO del rango seguro
                             # (72-180 ticks). Con los valores de lanzamiento: [1, 120]
    expression: "restantes(T) = ventana_castigo + 1 - T"
    notes: "Ticks que RESTAN de la ventana de Aturdimiento en el tick T, contados de
      forma INCLUSIVA: restantes(T) cuenta el tick T mismo como todavía disponible.
      T es el índice de tick BASE 1 dentro de Aturdido: T=1 el primer tick,
      T=ventana_castigo el último. output_range depende por tanto del knob, no es fijo.
      USO NORMATIVO: la desambiguación de input de Combate exige restantes(T) >
      gracia_salida_castigo (ESTRICTO) para clasificar una pulsación como Golpe de
      Castigo. Despejando: T <= ventana_castigo - gracia_salida_castigo. Es decir
          T_max_castigo = ventana_castigo - gracia_salida_castigo
      y el primer tick de Parry es el siguiente. Con los valores de lanzamiento:
      120 - 6 = 114 -> Castigo, 115 -> Parry.
      INVARIANTE DE ANCHURA: bajo este conteo inclusivo la zona de gracia mide
      EXACTAMENTE gracia_salida_castigo ticks para CUALQUIER par de valores, porque su
      anchura es ventana_castigo - T_max_castigo = g idénticamente. Bajo conteo
      exclusivo mide g + 1. Ese tick de más no era un error de cuenta puntual sino una
      propiedad del conteo elegido — por eso reaparecía cada vez que se recalculaba el
      borde a mano. NO ESCRIBIR 114 COMO LITERAL en documentos nuevos.
      REGISTRADO 2026-08-04 (enmienda E del GDD de Combate). Es la corrección del
      defecto de fondo del desacuerdo D1 de la 3ª pasada del sistema 2: aquel GDD
      DEFINIÓ NORMATIVAMENTE ESTE TÉRMINO SIN POSEERLO, y lo hizo con conteo exclusivo
      (ventana_castigo - T), bajo el cual la zona de gracia mide 7 ticks — el defecto
      exacto que su nota de corrección decía prevenir. ventana_castigo es propiedad de
      Combate, luego el término derivado de ella también lo es. El sistema 2 lo CONSUME.
      Verificado por el AC C11 de Combate (bordes 114/115 fijados por cifra)."
    added: 2026-08-04
    revised: ""

# Example:
