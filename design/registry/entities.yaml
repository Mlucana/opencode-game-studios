  - name: hitstop_parry
    status: active
    source: design/gdd/combate-parry-absorcion.md
    referenced_by:
      - design/gdd/combate-parry-absorcion.md
    value: 5
    unit: ticks de simulación fija a 60Hz (0.0833s de reloj real)
    notes: "Duración del hitstop de un parry exitoso. Rango seguro 3-6 ticks.
      CANONICALIZADO EN TICKS 2026-08-01 (re-review): el GDD declaraba '0.08s de tiempo
      real', pero 0.08 * 60 = 4.8 ticks — un valor NO ENTERO que ninguna implementación
      basada en el contador entero autoritativo (Regla 2, regla normativa 1) puede
      producir. Era una contradicción interna dentro de la propia sección de 'autoridad
      única del tiempo'. Detectado por godot-specialist.
      Son 5 ticks de RELOJ REAL, no 5 ticks de tiempo diegético escalado —
      interpretarlos como tiempo de juego al 4% daría ~2 segundos reales.
      INVARIANTE R8: hitstop_parry + bono_hitstop_parry_justo (+1-2) <= 8 ticks. Por eso
      el techo se recorta a 6 y no a 8: con hitstop_parry=8, un Parry Justo daría 9-10
      ticks, por encima del punto de ruptura de flujo que el propio knob declara.
      Detectado por systems-designer en la verificación de la re-review — era una
      instancia NUEVA del mismo defecto de 'rangos seguros por knob, no en combinación'
      introducida al añadir este knob.
      La escala de tiempo diegética NO afecta a la capa de HUD/UI (Regla 2, regla
      normativa 2). Engine.time_scale queda DESCARTADO como mecanismo: es global y
      Godot 4.7 no permite eximir subárboles. Verificado por los ACs C13 y C14.
      DIVERGENCIA CERRADA 2026-08-04 (changeset 1 de la 3ª pasada): este registry
      llevaba el rango correcto (3-6) desde la re-review, pero la tabla 'Impact
      Moments' del GDD seguía declarando 3-8, contradiciendo a su propia tabla de
      Tuning Knobs y a R8. El desalineado era el GDD, no el registry; ya alineado.
      Detectado independientemente por systems-designer y godot-specialist, que se
      negó a certificar implementabilidad mientras el documento no convergiera.
      EXPOSICIÓN DEL EXTREMO CORTO (godot-specialist, 3ª pasada): el suelo de 3 ticks
      (50ms) hace NO OPCIONAL fijar Tween y AnimationPlayer en modo de física —
      ambos evalúan por defecto en frames de render (TWEEN_PROCESS_IDLE,
      ANIMATION_CALLBACK_MODE_PROCESS_IDLE), y a 40Hz eso son hasta 25ms de
      desalineación: el 50% de la ventana en el suelo del rango, frente al ~19% que
      suponían contra el techo antiguo de 8."
