  - name: longitud_combo
    status: active
    source: design/gdd/combate-parry-absorcion.md
    referenced_by:
      - design/gdd/combate-parry-absorcion.md
      - design/gdd/maquina-estados-jefe.md
    value: "3-5"
    unit: número de golpes encadenados (N)
    notes: "RANGO LEGAL de longitud de combo. La COMPOSICIÓN de combos por ángel es
      propiedad de IA de Combate de Jefes (sistema 20), pero el RANGO lo impone este
      GDD — mismo patrón que multiplicador_ataque, porque es quien posee las dos
      invariantes que se romperían.
      SUELO N >= 3: lo exige la Fórmula 7 vía la invariante R7. Con
      modificador_combo_gracia = 0.5 y N=2, un combo produce 2*0.5 = 1.0 * gracia_base
      — EXACTAMENTE lo mismo que un golpe simple, incumpliendo la garantía escrita en
      la Regla 9 ('un combo genera más gracia que un golpe simple'). Fallaba en el
      propio valor shippeado, no en un extremo de tuning.
      TECHO N <= 5: lo exige el diseño de audio. El cue ascendente de los eventos 7->8
      'cierra' armónicamente en el último golpe; sin techo, la frase musical obliga a
      elegir entre clipping, un loop que rompe la ilusión de frase única, o una meseta
      muda. También acota la acumulación de esquirlas contra el presupuesto de 250
      partículas del art bible 8.6.
      Un patrón de 2 golpes NO es un combo: es una cadena de dos golpes simples, con
      Repliegue entre ellos y dos instancias de Postura.
      Fijado 2026-08-01 (re-review) por decisión de usuario, cerrando una Open Question
      que bloqueaba la autoría del sistema 16. Verificado por el AC C16.
      DEFENSA EN PROFUNDIDAD (2026-08-03): además del gate primario (AC C16 de Combate,
      validación de datos al cargar), el sistema 2 asevera 3 <= N <= 5 al entrar en el
      estado En Combo y falla ruidosamente si no se cumple (su AC C7). No duplica la
      PROPIEDAD de la regla — evita que un fallo del gate primario se manifieste como
      comportamiento indefinido silencioso dentro del bucle contado del contenedor.
      NOTA DE ÍNDICE (2026-08-03): la condición de aborto de combo es 'falla CUALQUIER
      golpe i, con 1 <= i <= N', incluido el último. El sistema 2 la tenía escrita como
      i < N, lo que dejaba el fallo del remate fuera de ambas ramas de su regla.
      SEGUNDA MITAD DEL MISMO CONTRATO, CORREGIDA 2026-08-04 (enmienda B): el AC C15 de
      COMBATE conservaba también 'i < N', y su cláusula de verificación pedía 'i
      intermedio y penúltimo' — excluyendo el remate por partida doble. Es el caso que
      importa: es donde el jugador ha parado N-1 golpes y lo pierde todo. Ejemplar del
      hallazgo de proceso de la 3ª pasada: el sistema 2 arregló SU lado de un contrato
      de dos lados y dejó el otro intacto. C15 exige ahora verificar i=1, uno intermedio
      e i=N, notando que en i=N el conjunto i+1..N es VACÍO y aun así debe dispararse
      Repliegue una sola vez sin aplicar Postura."
    added: 2026-08-01
    revised: 2026-08-04   # was: revised 2026-08-03

