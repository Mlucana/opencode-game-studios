# ─── CONSTANTS ───────────────────────────────────────────────────────────────
# Named numerical values referenced across multiple systems.
# Register a constant when it is defined in one GDD but another GDD must
# agree with it (e.g., gold carry limit defined in economy but checked in
# inventory, or base inventory slots defined in inventory but displayed in HUD).
#
# Required fields: name, status, source, referenced_by, value, unit, added

constants:
  - name: parry_window
    status: active
    source: design/gdd/combate-parry-absorcion.md
    referenced_by:
      - design/gdd/combate-parry-absorcion.md
    value: 0.22
    unit: segundos
    notes: "VALIDADO EMPÍRICAMENTE en el prototipo de concepto (72% de acierto,
      dentro del rango objetivo 65-80%). Duración durante la cual el parry
      permanece ACTIVO tras presionar — no es un instante puntual. Rango seguro
      0.15-0.30s. Por debajo de 0.15 el parry se siente aleatorio (45% medido).
      Debe ser configurable externamente para el modo de accesibilidad.
      FUENTE DE VERDAD CANÓNICA: 13 ticks de simulación fija a 60Hz (0.2167s). El
      valor 0.22 es el valor de diseño/legibilidad del que se deriva, no el valor
      runtime.
      INVARIANTE R2 (corregida dos veces): se evalúa EN TICKS, no en segundos —
      parry_window_ticks > 2 * umbral_precision * 60. La primera versión señalaba solo
      el punto 0.15; la segunda amplió a región pero seguía evaluando en segundos
      continuos, y con umbral_precision en su techo (0.12s) daba un límite de 0.24s.
      Es incorrecto: floor(0.24*60) = 14 ticks = 0.2333s, que YA FALLA. El límite real
      es 15 ticks (0.25s de diseño), y la región insegura es [0.15, 0.25) — el 66.7%
      del rango declarado seguro, no el 60%. Era la misma mezcla ticks/segundos que la
      Regla 2 existe para prevenir, colándose en la invariante que la cita.
      CIERRE DEFINITIVO (2026-08-04, changeset 2 ítem 1): la corrección anterior arregló
      la INVARIANTE y dejó el KNOB en segundos, con la conversión * 60 viviendo dentro de
      la propia guarda. Al canonicalizar umbral_precision a ticks (5, rango 3-7), R2 pasa
      a ser la comparación entera parry_window_ticks > 2 * umbral_precision_ticks
      (13 > 10) y el * 60 desaparece. El síntoma llevaba escrito en la invariante desde
      entonces: nadie convierte unidades dentro de una guarda si el dato ya está en las
      unidades correctas. Región de fallo sin cambios: umbral_precision = 7 exige
      parry_window >= 15 ticks.
      INVARIANTE R6 (nueva, 2026-08-01 re-review): ACOPLADO con recuperacion_whiff.
      cobertura = parry_window_ticks / (parry_window_ticks + recuperacion_whiff) <=
      0.65, equivalente a parry_window_ticks <= 1.857 * recuperacion_whiff. Con los
      valores actuales (13 y 9) = 59%. Este acoplamiento existía como prosa desde la
      revisión anterior pero NO era invariante normativa, así que quedó fuera del AC
      D9 — y 18 de las 70 combinaciones del producto cartesiano de sus rangos
      'seguros' individuales (25.7%) lo violaban sin que nada lo detectara.
      R6 APLICA A LOS VALORES EFECTIVOS TRAS RELIQUIAS, no solo a los de lanzamiento:
      una reliquia de '+2 fotogramas de ventana' reabriría el mash en silencio.
      Verificado por el AC D10.
      NOTA: dentro de una cadena de aciertos la cobertura sube legítimamente al ~84%
      (la recuperación de un parry EXITOSO es de 2-3 ticks). Eso es intencional — los
      combos lo exigen — y R6 no debe cerrarlo. La mitigación es la varianza de
      separación intra-combo exigida al sistema 20. Medido por el AC C12b.
      Debe ser configurable externamente para el modo de accesibilidad, JUNTO CON
      recuperacion_whiff y tuneado como par (bajar solo el segundo viola R6)."
    added: 2026-07-31
    revised: 2026-08-01

  - name: vida_base
    status: active
    source: design/gdd/combate-parry-absorcion.md
    referenced_by:
      - design/gdd/combate-parry-absorcion.md
    value: 100
    unit: puntos de vida
    notes: "Vida del jugador al inicio de cada run, antes de bonos de absorción o
      reliquias. Rango seguro 80-150 POR KNOB — NO en combinación.
      ACOPLADO A bono_vida_por_absorcion POR R5 (documentado 2026-08-04, changeset 1
      de la 3ª pasada). El suelo 80 NO es libre mientras angeles_max=3: con
      bono_vida_por_absorcion en su TECHO (20) hace falta vida_base >= 110 para
      cumplir R5; con el bono en su SUELO (15), vida_base >= 82. Es decir, el valor
      80 declarado aquí viola R5 en AMBOS extremos del rango del bono.
      Ver la nota de bono_vida_por_absorcion y el bloque 'Sobre R5' del GDD.
      ANCLA DE LA FÓRMULA 8 (añadido 2026-08-04, changeset 2 ítem 0): vida_base es el
      ancla de dano_golpe_enemigo, NO vida_maxima. Cambiar este valor mueve el daño
      enemigo en la misma proporción, pero NO el número de golpes hasta morir, que
      queda fijado por golpes_para_morir_base por construcción."
    added: 2026-07-31
    revised: 2026-08-04

  - name: umbral_precision
    status: active
    source: design/gdd/combate-parry-absorcion.md
    referenced_by:
      - design/gdd/combate-parry-absorcion.md
    value: 5
    unit: ticks de simulación fija (60Hz) — 0.0833s derivado
    notes: "Ancho de la escala de calidad_timing (Fórmula 1). Rango seguro 3-7 TICKS.
      CANONICALIZADO A TICKS el 2026-08-04, changeset 2 ítem 1. Valía '0.08s', que a
      60Hz son 4.8 ticks: exactamente el mismo valor no entero, por la misma razón, que
      la regla normativa 3 de la Regla 2 ya había corregido para hitstop_parry. El
      barrido de canonicalización visitó las duraciones de la máquina de estados
      (parry_window, recuperacion_whiff, retreat_base, ventana_castigo,
      gracia_salida_castigo, recuperacion_recepcion, hitstop_parry) y se saltó LA ÚNICA
      QUE VIVE DENTRO DE UNA FÓRMULA. Raíz A. La invariante R2 lo delataba desde
      entonces: multiplicaba * 60 dentro de sí misma, es decir sabía que necesitaba
      ticks y dejaba el knob en segundos.
      SUELO: por debajo de 3 quedan menos de 4 escalones y calidad_timing deja de
      discriminar precisión — el bono se vuelve casi binario.
      TECHO: acoplado con parry_window por R2 (parry_window_ticks > 2 *
      umbral_precision_ticks). Con umbral_precision = 7 hace falta parry_window >= 15,
      y el valor actual es 13: la esquina (9, 7) es la violación esperada de R2 en D9."
    added: 2026-07-31
    revised: 2026-08-04

  - name: umbral_parry_justo
    status: active
    source: design/gdd/combate-parry-absorcion.md
    referenced_by:
      - design/gdd/combate-parry-absorcion.md
    value: 0.9
    unit: valor de calidad_timing (adimensional)
    notes: "Predicado ÚNICO que clasifica un parry exitoso como 'Parry Justo'. Rango
      seguro 0.7-1.0. AÑADIDO 2026-08-04, changeset 2 ítem 1.
      QUÉ CIERRA: 'Parry Justo' se nombraba en doce sitios del GDD y gobernaba CINCO
      consumidores — la variante de esquirla #FFF8E7, la capa de audio del evento 4, el
      bono de hitstop de +1-2 ticks, el AC V4 y el Feel AC de 'los playtesters lo
      distinguen sin que se les explique', más el peor caso de P0 — y NINGÚN sitio decía
      qué valor de calidad_timing lo producía, ni qué distinguía el +1 del +2. Raíz C,
      quinta aparición, sobre la escala de recompensa más visible del sistema: cinco
      capas reaccionando a un predicado inexistente. Solo se volvió cerrable al escalonar
      calidad_timing. Verificado por el AC C25, que exige que las tres señales disparen
      sobre el mismo predicado y ninguna por debajo de él.
      SE EXPRESA EN CALIDAD, NUNCA EN TICKS: con umbral_precision de 5 a 7 equivale a
      Delta <= 1, y con 3 o 4 a Delta = 0. Mismo tratamiento que el borde de Castigo —
      se deriva de los knobs, no se escribe como literal.
      SUELO: a 0.7 o menos deja de ser una distinción de precisión y el Feel AC se
      vuelve infalsable."
    added: 2026-08-04
    revised: 2026-08-04

  - name: bono_hitstop_parry_justo
    status: active
    source: design/gdd/combate-parry-absorcion.md
    referenced_by:
      - design/gdd/combate-parry-absorcion.md
    value: 2                    # en calidad_timing = 1.0; +1 en 0.9; +0 por debajo
    unit: ticks de simulación fija
    notes: "Micro-extensión del hitstop que diferencia el Parry Justo. Reparto por
      escalón de calidad_timing: 1.0 -> +2 ticks, 0.9 -> +1, por debajo de
      umbral_parry_justo -> +0. PROMOVIDO DE PROSA A KNOB el 2026-08-04, changeset 2
      ítem 1: R8 y el AC D9 lo nombraban desde el changeset 1 sin que existiera fila
      propia en Tuning Knobs — mismo defecto DE TIPO que tuvo recuperacion_recepcion (un
      contrato que nombra algo que no existe). Y el reparto nunca se declaró: Impact
      Moments decía '+1-2 ticks' sin decir qué elegía entre 1 y 2, sobre una
      calidad_timing que además era continua.
      ACOTADO POR R8: hitstop_parry + bono_hitstop_parry_justo <= 8 ticks. Con los
      valores actuales 5 + 2 = 7. Por eso el techo de hitstop_parry se recortó a 6.
      SUELO: por debajo de +1 el Parry Justo pierde su canal háptico y queda solo en
      color y audio — relevante para la pregunta de accesibilidad, donde creative-director
      recomendó reforzar precisamente el canal háptico antes que el visual o el sonoro."
    added: 2026-08-04
    revised: 2026-08-04

  - name: golpes_para_morir_base
    status: active
    source: design/gdd/combate-parry-absorcion.md
    referenced_by:
      - design/gdd/combate-parry-absorcion.md
    value: 4
    unit: golpes no parados
    notes: "Presupuesto de error del duelo: Golpe's no parados que matan a un jugador a
      Vida base, sin absorciones ni reliquias. Rango seguro 3-6. Denominador de la
      Fórmula 8. AÑADIDO 2026-08-04, changeset 2 ítem 0.
      Por qué 4 (decisión de usuario): 100/4 = 25 es exacto; en Humanidad jugador y
      ángel se intercambian al mismo ritmo (25% de daño cada uno, = punish_dano_pct de
      la Fórmula 3). El valor 6 se descartó explícitamente porque 100/6 = 16.666...
      reintroduce en el recurso del jugador el decimal periódico que en el changeset 1
      obligó a escribir el clamp de la Vida del jefe.
      SUELO: por debajo de 4 el lockout de whiff se vuelve desproporcionado — un Golpe
      que abre durante los 9 ticks de Recuperación de whiff es imparable por
      construcción, así que a 3 golpes el jugador que explora el timing puede perder un
      duelo por un coste que la Regla 7 declara 'de tiempo, no de recurso'.
      ACOPLADO A R9a: la suma de severidad_accion_especial sobre un duelo no puede
      exceder golpes_para_morir_base - 1 (= 3 con el valor actual). Bajar este knob
      estrecha automáticamente el presupuesto de Ventanas Especiales del sistema 20.
      Verificado por los ACs D11, D12 y D13(b)."
    added: 2026-08-04
    revised: 2026-08-04

  - name: severidad_accion_especial
    status: active
    source: design/gdd/combate-parry-absorcion.md
    referenced_by:
      - design/gdd/combate-parry-absorcion.md
    value: null                 # la declara el sistema 20 por habilidad; este GDD solo
                                # acota la banda legal (constraint-handoff)
    unit: múltiplos de dano_golpe_enemigo
    notes: "Coste que impone al jugador una Acción Especial COMPLETADA — es decir, el
      precio de ignorar una Ventana Especial. Lo declara la IA de Combate de Jefes
      (sistema 20) por habilidad; este GDD no lo posee pero SÍ posee la invariante que
      se rompería, así que declara la banda (mismo constraint-handoff que 3 <= N <= 5,
      R4, precedencia armónica y R6 sobre efectivos). AÑADIDO 2026-08-04, changeset 2
      ítem 0. La componente acotada aquí se paga en VIDA; el sistema 20 puede añadir
      consecuencias no-Vida por encima.
      INVARIANTE R9a — DOS CLÁUSULAS, ambas obligatorias:
        (a) por ventana:  1.0 <= severidad_accion_especial <= 2.0
        (b) por duelo:    suma de severidades <= golpes_para_morir_base - 1  (= 3)
      Un patrón que viole cualquiera de las dos debe FALLAR LA VALIDACIÓN DE DATOS AL
      CARGAR, no degradarse en silencio (AC D13, misma forma que C16 para 3 <= N <= 5).
      QUÉ CIERRA: antes de R9a, ignorar la Ventana Especial DOMINABA ESTRICTAMENTE a
      pararla — mismo beneficio de combate (ninguno: ni Postura ni Repliegue, Regla 4)
      y menos coste (pararla gasta Gracia = corrupción; ignorarla no gastaba nada, pues
      sin pulsación no hay whiff por la Regla 7 y la ventana no daña por el corolario de
      la Regla 6). El único coste declarado era la frase 'el jefe completa su habilidad',
      severidad que el GDD nombraba sin exigir a nadie garantizarla. Hallazgo de
      game-designer en la 3ª pasada, PERDIDO EN LA SÍNTESIS y recuperado al cerrar.
      POR QUÉ (b) NO ES REDUNDANTE: la banda acota un TÉRMINO; lo que mata es la SUMA, y
      cuántas Ventanas Especiales emite un duelo es propiedad del sistema 20. Con solo
      (a), tres VEs a 2.0 imponen 150 de daño ignorable a un jugador de 100 de Vida y
      pararlas pasa a ser OBLIGATORIO, destruyendo el dilema por el lado opuesto. Sin (b)
      habría sido la cuarta aparición de la raíz C (guarda sobre un término, no sobre la
      magnitud) y la cuarta inecuación de un solo lado tras R4, R5 y R8.
      DISEÑO: con un coste garantizado, parar e ignorar dejan de ser comparables en una
      sola dimensión (parar evita el coste y gasta corrupción; ignorar al revés), y la
      Ventana Especial pasa a ser la instancia por-encuentro del dilema por-duelo de la
      Fórmula 5. Medido por el AC C23 (oposición de signos entre las dos monedas).
      CORREGIDO 2026-08-04 (changeset 2 ítem 3) — ES UNA EQUIVALENCIA, NO UN PAGO EN VIDA.
      La formulación del ítem 0 exigía pagarlo en Vida y CONTRADECÍA FRONTALMENTE al
      sistema 2, que declara dos veces y en negrita que 'el estado Acción Especial nunca
      reduce la Vida del jugador, en ninguna rama' (decisión de usuario 2026-08-03, razón:
      una curación que además fuese ataque sería doble castigo por un solo error). El ítem
      0 fijó la moneda sin comprobar la tabla de Edge Cases del sistema 2. Como ese GDD
      está congelado y su regla es correcta, la corrección cae entera en el sistema 1.
      REGLA DE CONVERSIÓN: el coste se paga en la moneda en la que la habilidad opera y el
      sistema 20 declara su equivalencia:
        coste_equivalente = parries_extra_forzados * (1 - tasa_acierto_objetivo)
      con tasa_acierto_objetivo = 0.72, la MEDIDA EN EL PROTOTIPO, no un número inventado.
      Un Golpe no parado cuesta 1 unidad por definición.
      EJEMPLO (Cosmos, dano_golpe_castigo=40, parries_por_ciclo=4): una curación de 40
      equivale a 4*0.28 = 1.12 unidades (en banda); una de 80 da 2.24 (fuera). Techo de la
      banda: H <= 71 para esa tríada. Acota por primera vez el riesgo alto sin mitigación
      de 'curación de jefes' de systems-index.md, aunque no lo cierra: una habilidad NO
      interrumpible sigue fuera de esta banda.
      El AC D13 exige además que todo patrón interrumpible DECLARE su equivalencia; no
      existe la categoría 'coste no cuantificado'.
      DEPENDE DE R9b (restricción hacia el sistema 5): la Gracia obtenida al parar una
      Ventana Especial debe tener coste NO NULO en la economía de corrupción. Si Gracia
      se diseñara como beneficio sin contrapartida, la dominación reaparecería INVERTIDA
      (parar dominaría a ignorar) y R9a no lo detectaría."
    added: 2026-08-04
    revised: 2026-08-04

  - name: bono_vida_por_absorcion
    status: active
    source: design/gdd/combate-parry-absorcion.md
    referenced_by:
      - design/gdd/combate-parry-absorcion.md
    value: 18
    unit: puntos de vida
    notes: "KNOB MÁS DELICADO DEL SISTEMA. Vida máxima ganada por cada decisión
      'absorber'. Rango canónico 15-20 (corregido 2026-08-01: estas notas decían
      '>25', contradiciendo el rango único 15-20 que el propio GDD ya había fijado).
      Prioridad alta de vigilancia en playtesting. Valor provisional — validar junto
      al GDD de Sistema de Gracia.
      INVARIANTE R5: (bono_vida_por_absorcion * angeles_max) / vida_base <= 0.55.
      Actual: (18*3)/100 = 54%. Este knob y vida_base están ACOPLADOS y deben
      tunearse como par — el rango 15-20 solo es seguro con vida_base=100.
      DOS de las cuatro esquinas violan R5, no una (corregido 2026-08-04, changeset 1
      de la 3ª pasada; hallazgo de systems-designer): (bono=20, vida_base=80) da 75%,
      Y (bono=15, vida_base=80) da (15*3)/80 = 56.25%, que TAMBIÉN incumple. Es decir,
      incluso el valor más conservador de este knob viola R5 cuando vida_base está en
      su propio suelo legal. La formulación anterior de estas notas documentaba solo
      la esquina del techo e inducía a leer 'no exceder 20' como la guía completa.
      Suelos efectivos de vida_base: 110 (para todo el rango del bono), 82 (solo para
      el suelo). El AC D9(b) declara ahora 2 violaciones esperadas en R5, no 1.
      AVISO 1: R5 solo está calibrada para angeles_max=3 (v1.0/Alpha). Con los 9 coros
      de la visión completa daría (18*9)/100 = 162% — y encoger la constante para
      cumplir daría ~6.1 HP/ángel, lo que cierra el agujero agregado pero DESTRUYE el
      peso por decisión. Es la FORMA de la fórmula lo que debe cambiar (rendimiento
      decreciente POR CONTEO, no por identidad, para preservar la independencia de
      orden de la Regla 8 y el AC E9), no solo el valor. Hallazgo de economy-designer.
      AVISO 2 — BLOQUEANTE PENDIENTE (changeset 2): R5 guarda UN término de una suma
      de TRES. bono_reliquias entra aditivamente en vida_maxima y está declarado sin
      tope, así que una sola reliquia del orden de una absorción vuelve falsa la
      premisa que justifica R5. Ver la nota de vida_maxima.
      AVISO 3 — CERRADO el 2026-08-04 por R10a (changeset 2 ítem 2). Detectado al derivar
      la Fórmula 8 y registrado sin cerrar por la regla 'ningún hallazgo se cierra en la
      sesión en que se encuentra'; cerrado en la sesión siguiente: R5 acota la razón en PUNTOS DE VIDA (54%, bajo el techo de 55%), pero
      la moneda que el jugador percibe son GOLPES SOBREVIVIDOS, y el redondeo hacia
      arriba la amplifica: ceil(100/25) = 4 golpes sin absorber frente a ceil(154/25) = 7
      con las tres absorciones, un +75% y no un +54%. R5 se calibró sobre el término y no
      sobre la magnitud — misma forma de la raíz C, aplicada a la invariante que guarda
      este knob. Hecho visible por el AC D12.
      NO se cerró moviendo el techo de R5 (arrastraría bono_vida_por_absorcion, vida_base
      y los suelos 110/82, y seguiría midiendo puntos), sino declarando R10a directamente
      en golpes sobrevividos y sobre los TRES términos de la suma. Una invariante por
      unidad: R5 en puntos para el tuning propio de este GDD, R10a en golpes para el
      contrato con el sistema 9."
    added: 2026-07-31
    revised: 2026-08-04

  - name: retreat_base
    status: active
    source: design/gdd/combate-parry-absorcion.md
