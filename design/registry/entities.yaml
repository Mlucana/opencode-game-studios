  - name: recuperacion_castigo
    status: active
    source: design/gdd/combate-parry-absorcion.md
    referenced_by:
      - design/gdd/combate-parry-absorcion.md
      - design/gdd/maquina-estados-jefe.md
    value: "10-14"
    unit: fotogramas (ticks de simulación fija a 60Hz)
    notes: "Recuperación del jugador tras ejecutar un Golpe de Castigo, durante la cual
      NO puede iniciar Parry (una de las dos únicas excepciones a la Regla 7 de
      Combate). Ver Animation Feel Targets: 6-8 de inicio, 4-6 activos, 10-14 de
      recuperación.
      REGISTRADO 2026-08-03 (/consistency-check): su TECHO (14) sostiene toda la
      justificación del colchón de la CORE RULE 4 del sistema 2 — el jefe pasa por
      Repliegue (42 ticks) tras un Castigo conectado para que su siguiente ataque no
      pueda resolverse mientras el jugador sigue comprometido. 42/14 = 3 EXACTO
      ('triplica'). Es también la constante cuyo mal cálculo produjo el error
      'cuadriplica' de la 1ª pasada de /design-review del sistema 2.
      Los fotogramas de INICIO (6-8) y ACTIVOS (4-6) definen además la banda de contacto
      del Castigo (una pulsación en el tick T impacta entre T+6 y T+14), que es lo que
      hace posible el edge case E3 del sistema 2. Ver ventana_castigo.
      CONSECUENCIA: subir este techo por encima de 14 invalida el margen del colchón sin
      que nada lo detecte. Cualquier retune debe reverificar la Core Rule 4."
    added: 2026-08-03
    revised: ""

