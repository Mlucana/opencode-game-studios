    notes: "Duración del estado Aturdido del enemigo tras romper Postura, durante la
      cual el jugador puede conectar el Golpe de Castigo. Rango seguro 1.2-3.0s
      (72-180 ticks). Añadido tras un gap de especificación detectado por qa-lead.
      RESTAURACIÓN DE POSTURA (aclarado 2026-08-01, re-review): la Postura se restaura
      POR COMPLETO a postura_max en AMBAS salidas del Aturdimiento — tanto si la
      ventana expira sin usarse como si el Golpe de Castigo CONECTA. La única
      diferencia entre ambas es si se aplicó daño a la Vida del ángel. Hasta la
      re-review solo estaba declarado el caso de expiración; el caso más común (el
      castigo exitoso) quedaba INFERIDO desde la aritmética de la Fórmula 3, pese a
      ser la premisa silenciosa del conteo 12/20/30 y del ejemplo de ~35-40 parries.
      Detectado por systems-designer. Verificado por el AC E10.
      Canonicalizado en ticks: 2.0 * 60 = 120 exacto.
      CONVENCIÓN DE BORDE (normativa — REVERTIDA 2026-08-04, ver más abajo):
      restantes(T) = ventana_castigo + 1 - T. Conteo INCLUSIVO: cuenta el tick T mismo
      como disponible. T es base 1. restantes(1) = ventana_castigo; restantes(último) = 1.
      Registrada como fórmula propia: ver `restantes` en la sección formulas.
      De ahí se derivan los dos bordes, que NO son el mismo número:
        - último tick en que una PULSACIÓN se clasifica como Castigo:
              T_max_castigo = ventana_castigo - gracia_salida_castigo
          (la desambiguación exige restantes(T) > gracia_salida_castigo, ESTRICTO, de
          donde ventana_castigo + 1 - T > g  <=>  T <= ventana_castigo - g).
          Con los valores de lanzamiento: 120 - 6 = 114 -> Castigo; 115 -> Parry.
        - el CONTACTO cae más tarde: con 6-8 ticks de inicio + 4-6 activos, una
          pulsación en el tick T impacta entre T+6 y T+14.
      El sistema 2 gobierna el CONTACTO; Combate gobierna la PULSACIÓN.
      INVARIANTE DE ANCHURA (la razón estructural del bug, no una cifra corregida):
      bajo conteo INCLUSIVO la zona de gracia mide EXACTAMENTE gracia_salida_castigo
      ticks, sean cuales sean los valores de los dos knobs — porque su anchura es
      ventana_castigo - T_max_castigo = g, idénticamente. Bajo conteo EXCLUSIVO mide
      g + 1. Ahí está el tick de más: no es un error aritmético puntual sino una
      propiedad del conteo elegido, y por eso reaparecía cada vez que alguien
      recalculaba el borde a mano.
      NO ESCRIBIR 114 COMO LITERAL en documentos nuevos: derivarlo de los dos knobs.
      ventana_castigo tiene rango seguro 72-180 y gracia_salida_castigo 4-10, así que
      el borde se mueve con cualquier retune. Este registry ya corrigió el mismo defecto
      de literal-en-vez-de-knob en postura_max y en punish_dano_pct; la nota del 113
      volvía a cometerlo y la enmienda del 2026-08-04 lo heredó antes de corregirse en
      la auditoría de la propia enmienda.
      REVERSIÓN 2026-08-04 (era: restantes(T) = ventana_castigo - T, borde 113).
      La corrección del 2026-08-03 estaba INVERTIDA y produjo el defecto que decía
      prevenir: bajo conteo exclusivo la zona de gracia mide 7 ticks (114-120), no 6.
      Las TRES formulaciones de Combate — 'los últimos gracia_salida_castigo
      fotogramas' (Regla 5), 'quedan más de gracia_salida_castigo' (desambiguación de
      input) y el AC C11, que contiene ambas y las declara equivalentes — son
      consistentes entre sí SOLO bajo conteo inclusivo. Detectado por systems-designer
      y verificado de forma independiente por creative-director en la 3ª pasada del
      sistema 2 (desacuerdo D1); re-verificado al aplicar la enmienda.
      DEFECTO DE FONDO: el sistema 2 definió normativamente un término que NO POSEE.
      ventana_castigo es de Combate, luego restantes(T) también. Combate lo declara
      desde el 2026-08-04 (Regla 5, enmienda E); el sistema 2 lo CONSUME.
      DEUDA ABIERTA (4ª pasada del sistema 2, raíz R5): su AC E3b sigue diciendo 113.
      No pudo editarse en el mismo changeset porque ese GDD está congelado.
      DEUDA ABIERTA SEPARADA (hallazgo A4, 3ª pasada): la BANDA DE CONTACTO de una
      pulsación legal tardía rebasa ventana_castigo — el golpe no hace nada y no avisa
      mientras el jugador queda 10-14 ticks comprometido. Es un borde distinto del de
      la pulsación y NO lo cierra la enmienda E. Sigue abierto."
    added: 2026-07-31
    revised: 2026-08-04   # was: revised 2026-08-03 (y antes 2026-08-01)

  - name: recuperacion_whiff
    status: active
    source: design/gdd/combate-parry-absorcion.md
    referenced_by:
      - design/gdd/combate-parry-absorcion.md
    value: 9
    unit: fotogramas (ticks de simulación fija a 60Hz)
    notes: "Recuperación tras un parry que vence sin encontrar ningún Golpe (whiff),
      durante la cual no puede iniciarse otro parry y los inputs se DESCARTAN (no se
      encolan en buffer). Un parry EXITOSO no paga esta recuperación — mantiene los
      2-3 fotogramas mínimos, para no romper las cadenas de parry de un combo.
      Rango seguro 6-12. Por debajo de 6 la cobertura temporal supera el 68% y el
      mash vuelve a ser viable — es un suelo duro, no una preferencia.
      RAZÓN DE EXISTIR: sin este coste, la ventana activa de 13 ticks sobre un ciclo
      de 15-16 cubría el 81-87% del tiempo y machacar el botón era una estrategia de
      supervivencia que NINGUNA variabilidad de cadencia del sistema 20 podía
      derrotar. Es aritmética, no diseño de IA. Con 9, la cobertura del que machaca
      cae a ~59% y el que lee el patrón no paga nada. Coste de TIEMPO, no de recurso
      — la Regla 7 y el Pilar 2 quedan intactos.
      Añadido 2026-08-01 tras revisión adversarial (game-designer + creative-director).
      REVISADO 2026-08-01 (re-review) — tres límites de esta decisión, ahora acotados:
      (1) INVARIANTE R6: el acoplamiento con parry_window nunca se promovió a
      invariante normativa, y 18 de las 70 combinaciones de sus rangos 'seguros'
      individuales (25.7%) violaban el objetivo del 65%. Formalizado. Ver parry_window.
      (2) El 59% describe el bucle de whiff PURO; dentro de una cadena de aciertos la
      cobertura sube al ~84% (la recuperación de un parry exitoso es de 2-3 ticks), lo
      que hace que un masher afortunado entre en cobertura casi total durante un combo.
      Mitigado por la varianza intra-combo exigida al sistema 20; medido por C12b.
      (3) ACCESIBILIDAD: este knob debe exponerse al sistema 21 igual que parry_window
      — el coste no distingue entre 'machacó' y 'jugador con dificultad motora falló
      honestamente', y el segundo lo paga mucho más a menudo. Deben tunearse COMO PAR
      o el modo de asistencia violará R6.
      RECHAZADO en la re-review: cancelar el lockout si un Golpe empieza dentro de él
      (propuesta de game-designer). Anularía el coste exactamente en el único momento
      en que importa. Confirmado por creative-director y por el usuario.
      Verificado por los ACs C10, C12a, C17 y D9."
    added: 2026-08-01
    revised: 2026-08-01

